[project]
name = "RET-C2-327"
version = "0.1.0"
description = "Validates price claims in marketing copy against live competitor prices before publication using 景品表示法 compliance rules"
requires-python = ">=3.11"
# agenticstar-agentcore is resolved from the internal package registry (the install
# step passes it as an extra index), with the openai extra for AzureOpenAIClient and
# the marketplace extra for cli.py's run_agent_marketplace().
# pyyaml is a real runtime dependency: PB-7 imports it to read config/config.yaml
# when checking hitl.enabled.
dependencies = [
    "agenticstar-agentcore[openai,marketplace]==1.0.3",
    "python-dotenv==1.2.2",
    "pyyaml==6.0.1",
]

[tool.uv]
# agenticstar-agentcore's published package-index metadata can pin a
# langchain-core version incompatible with what its own "openai" extra
# (-> langchain-openai) requires — a confirmed cause of failures that only show
# up on a registry install, never in a local mock run. Force the
# SDK-compatible version the agentcore release actually ships with; re-verify
# this pin if the agenticstar-agentcore version above ever changes.
override-dependencies = [
    "langchain-core==1.5.4",
]

[project.optional-dependencies]
dev = [
    "pytest==9.0.3",
    "pytest-cov==5.0.0",
    "pytest-asyncio==1.4.0",
    "ruff==0.4.4",
    "mypy==1.10.0",
]

[build-system]
requires = ["setuptools==68.0.0"]
build-backend = "setuptools.build_meta"

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.mypy]
python_version = "3.11"
strict = true

# The agenticstar-agentcore wheel ships no py.typed marker, so framework/shared
# imports are untyped (Any) and subclassing them is unavoidable in src/.
[[tool.mypy.overrides]]
module = ["framework.*", "shared.*", "langgraph.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["src.*"]
disallow_subclassing_any = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
